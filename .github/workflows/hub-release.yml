name: Hub release

# A release is made from main, by changing the VERSION file in a pull request. When a push to main
# changes VERSION and the Test workflow has passed on that commit, this builds the hub's native
# programs, signs a release bundle, tags the commit v<VERSION> and publishes it as a GitHub Release.
# Install it with tools/push_release.py or from the app's Setup > Software update.
# A VERSION that already has a tag, or 0.0.0 (nothing released yet), does nothing, so merging without
# a bump never releases.
# Run by hand from main (Actions > Hub release > Run workflow): with "publish" off it builds and signs
# a bundle as a downloadable artifact only; with it on it publishes VERSION the way a push does.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish VERSION as a release (otherwise only build a download)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hub-release-${{ github.sha }}
  cancel-in-progress: false

env:
  # The pinned MIPS/uClibc toolchain the repo's build notes use (docs/BUILD.md). The hash is checked,
  # so a changed download can't silently change what runs on the hub.
  TOOLCHAIN_NAME: mips32--uclibc--stable-2017.05-toolchains-1-1
  TOOLCHAIN_SHA256: a75aeb0f82eaeaf1989a7dfdf80219486b5ed1470c29c6f253fbcf824922c29f

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # to look up whether the Test workflow passed
    timeout-minutes: 30
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # all tags, to check VERSION against earlier releases

      - name: Work out what to release
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          skip=false; publish=false; version="0.0.0-dev-${GITHUB_SHA::7}"; code=1
          # Written once, whichever way this exits.
          trap '{ echo "skip=$skip"; echo "publish=$publish"; echo "version=$version"; echo "code=$code"; } >> "$GITHUB_OUTPUT"' EXIT
          # A hand-run build is signed with the real key, so only main may be built this way.
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Run this workflow from main."; exit 1; }
          [[ "$PUBLISH" == "true" ]] || exit 0
          version=$(tr -d ' \t\r\n' < VERSION)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::VERSION must look like 1.2.3 without leading zeros (it is '$version')"; exit 1; }
          if [[ "$version" == "0.0.0" ]]; then
            echo "::notice::VERSION is 0.0.0 (nothing released yet); nothing to do."
            skip=true; exit 0
          fi
          # Released means a published GitHub Release exists; a tag left by a failed run does not count.
          if [[ "$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null)" == "false" ]]; then
            echo "::notice::v$version is already released; nothing to do. Change VERSION to release again."
            skip=true; exit 0
          fi
          git fetch --quiet --tags origin
          newest=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1 || true)
          if [[ -n "$newest" && "$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -1)" != "$version" ]]; then
            echo "::error::VERSION $version is lower than the newest release $newest; versions only go up."; exit 1
          fi
          # Only tested code is signed with the real key. Test runs on the same push, so it may not
          # be listed yet, or may still be going: wait for it (a few minutes to appear, 15 to finish).
          for attempt in $(seq 1 30); do
            # One look at the runs gives all three numbers, so a run that finishes while we ask cannot count as still
            # going in one question and as not passed in the next (that once failed a release whose tests had passed).
            read -r passed listed running <<<"$(gh run list --workflow Test --commit "$GITHUB_SHA" --json status,conclusion \
              --jq '[([.[] | select(.conclusion == "success")] | length), length, ([.[] | select(.status != "completed")] | length)] | @tsv')"
            [[ "$passed" -gt 0 ]] && break
            if [[ "$listed" -gt 0 && "$running" -eq 0 ]]; then
              echo "::error::The Test workflow ran on this commit and did not pass."; exit 1
            fi
            [[ "$listed" -gt 0 || "$attempt" -le 6 ]] || { echo "::error::No Test run was found for this commit."; exit 1; }
            echo "Waiting for the Test workflow on this commit..."
            sleep 30
          done
          [[ "$passed" -gt 0 ]] || { echo "::error::The Test workflow did not finish in time."; exit 1; }
          publish=true
          echo "Releasing $version"

  release:
    needs: plan
    permissions:
      contents: write   # to create the release
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install the signing library
        run: pip install cryptography==50.0.2

      - name: Release bundle tests
        run: python3 tools/test_release_bundle.py

      - name: Cache the compiler
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/toolchain
          key: ${{ env.TOOLCHAIN_NAME }}-${{ env.TOOLCHAIN_SHA256 }}

      - name: Fetch the MIPS compiler
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ~/toolchain && cd ~/toolchain
          curl -fsSL -o toolchain.tar.bz2 "https://toolchains.bootlin.com/downloads/releases/toolchains/mips32/tarballs/$TOOLCHAIN_NAME.tar.bz2"
          echo "$TOOLCHAIN_SHA256  toolchain.tar.bz2" | sha256sum -c -
          tar -xf toolchain.tar.bz2 && rm toolchain.tar.bz2

      - name: Build the hub's native programs
        shell: bash
        run: |
          cc=$(ls "$HOME"/toolchain/*/bin/mips-buildroot-linux-uclibc-gcc | head -1)
          python3 tools/build_payload.py --cc "$cc" --output build/output
          # They must really be static 32-bit big-endian MIPS programs, small enough for the updater.
          for f in codex_webui codex_hbus codex_hal_ltcp codex_bthid_keyboard codex_portal; do
            kind=$(file -b "build/output/$f")
            [[ "$kind" == *"MSB executable, MIPS"* && "$kind" == *"statically linked"* ]] || { echo "::error::$f is not a static big-endian MIPS program: $kind"; exit 1; }
            (( $(stat -c %s "build/output/$f") <= 1500000 )) || { echo "::error::$f is larger than the updater allows"; exit 1; }
          done
          # A program built from older source would pass the checks above and still be wrong.
          # (To a file first: "strings | grep -q" can fail under pipefail when grep exits early.)
          strings -a build/output/codex_webui > "$RUNNER_TEMP/webui-strings.txt"
          for word in hubName networkDevices ListApps updates/status; do
            grep -q -- "$word" "$RUNNER_TEMP/webui-strings.txt" || { echo "::error::codex_webui lacks '$word': built from the wrong source?"; exit 1; }
          done

      - name: Sign the release bundle
        id: bundle
        shell: bash
        env:
          KEY_PEM: ${{ secrets.HUB_RELEASE_KEY_PEM }}
          PUBLIC_KEY: ${{ vars.HUB_RELEASE_PUBLIC_KEY }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          [[ -n "$KEY_PEM" ]] || { echo "::error::The secret HUB_RELEASE_KEY_PEM is not set (see docs/BUILD.md, Releases from GitHub)"; exit 1; }
          [[ -n "$PUBLIC_KEY" ]] || { echo "::error::The variable HUB_RELEASE_PUBLIC_KEY is not set (see docs/BUILD.md, Releases from GitHub)"; exit 1; }
          printf '%s\n' "$KEY_PEM" > "$RUNNER_TEMP/release-key.pem"
          chmod 600 "$RUNNER_TEMP/release-key.pem"
          out="hub-release-$VERSION.json"
          python3 tools/release_bundle.py --key "$RUNNER_TEMP/release-key.pem" --bin-dir build/output --version "$VERSION" --out "$out"
          # The key that signed it must be the one the hubs were given, and the result must verify with it.
          python3 - "$out" "$PUBLIC_KEY" <<'PY'
          import json, sys
          sys.path.insert(0, "tools")
          import release_bundle as rb
          manifest = rb.verify(json.load(open(sys.argv[1])), sys.argv[2].strip())
          print("Verified", manifest["version"], "with", len(manifest["files"]), "files")
          PY
          rm -f "$RUNNER_TEMP/release-key.pem"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Remove the signing key from the runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release-key.pem"

      - name: Publish the release
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v${{ needs.plan.outputs.version }}"
          # A failed earlier attempt can leave an unpublished draft behind; replace it.
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" == "true" ]]; then gh release delete "$tag" --yes; fi
          gh release create "$tag" "${{ steps.bundle.outputs.file }}" "${{ steps.bundle.outputs.file }}.sha256" \
            --title "Hub software ${{ needs.plan.outputs.version }}" --generate-notes --target "$GITHUB_SHA"

      - name: Keep the bundle as a download (hand-run builds)
        if: needs.plan.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.file }}
          path: |
            ${{ steps.bundle.outputs.file }}
            ${{ steps.bundle.outputs.file }}.sha256
          retention-days: 7
